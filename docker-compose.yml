services:
  web:
    build:
      context: .
      # NEXT_PUBLIC_* vars are baked into the client bundle at build time —
      # changing them means rebuilding (docker compose up --build), not just
      # restarting. Compose fills these in from a .env file in this
      # directory (see README.md "Backend setup").
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # NEXT_PUBLIC_SITE_URL is read server-side per-request, so runtime is fine.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
